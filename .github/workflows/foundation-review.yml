name: Foundation Review
on:
  push:
    branches: [foundation-review-2026-09-08]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test --if-present
      - uses: actions/upload-artifact@v4
        with:
          name: kovo-foundation-source
          path: |
            src
            public
            docs
            package.json
            package-lock.json
            vite.config.js
            index.html
            AGENTS.md
            README.md
          retention-days: 1
